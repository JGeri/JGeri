name: Hullámforma

# Naponta újrarajzolja az assets/waveform-*.svg fájlokat a profil hozzájárulásaiból.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/waveform.py"
      - ".github/workflows/waveform.yml"

permissions:
  contents: write

concurrency:
  group: hullamforma
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hullámforma rajzolása
        run: python .github/scripts/waveform.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit, ha változott
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/waveform-dark.svg assets/waveform-light.svg
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "chore: hullámforma frissítése"
            git push
          fi
